server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the HTML document. nginx drops server-level
    # add_header in any location that sets its own, so they live in an
    # include used by every location below. __API_ORIGIN__ is replaced at
    # image build time with the origin of VITE_API_BASE_URL.

    # SPA routing - serve index.html for all routes
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
