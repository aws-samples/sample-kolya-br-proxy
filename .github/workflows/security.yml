name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '.*\.lock$' \
            --exclude-files '.*\.tfstate.*' \
            --exclude-files 'uv\.lock' \
            --exclude-files 'pnpm-lock\.yaml' \
            --exclude-files 'package-lock\.json'

  dependency-audit-python:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # astral-sh/setup-uv v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884

      - name: Audit with pip-audit
        run: |
          uv export --no-dev --format requirements-txt | \
            uvx pip-audit -r /dev/stdin \
              --ignore-vuln CVE-2024-23342 \
              --ignore-vuln CVE-2026-4539 \
              --ignore-vuln CVE-2026-34073 \
              --ignore-vuln CVE-2026-33936 \
              --ignore-vuln MAL-2026-4750

  dependency-audit-node:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # tfsec 已归档并并入 Trivy；且 aquasecurity 组织启用了 IP 白名单，
      # tfsec-action 无法从 GitHub API 下载二进制（403）。下方 Trivy config
      # 扫描已覆盖 Terraform 错误配置，故移除 tfsec。
      - name: Run trivy on IaC
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: iac
          exit-code: "0"
          severity: HIGH,CRITICAL
